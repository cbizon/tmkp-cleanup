[project]
name = "tmkp-cleanup"
version = "1.0.0"
description = "Jev-based cleaning of the Text Mining KP (TMKP) graph for Translator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "typesafe-sdk==0.7.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 120
